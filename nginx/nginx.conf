user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Max upload size (adjuntos futuros)
    client_max_body_size 10m;

    # =========================================================================
    # Gzip Compression
    # =========================================================================
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # =========================================================================
    # Rate Limiting Zones
    # =========================================================================
    # General API: 10 req/s por IP, zona de 10MB (~160k IPs)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Login brute-force protection: 5 req/min por IP
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Respuesta cuando se supera el límite
    limit_req_status  429;
    limit_req_log_level warn;

    # =========================================================================
    # Upstreams
    # =========================================================================
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:4000;
    }

    # =========================================================================
    # Server Block
    # =========================================================================
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options        "SAMEORIGIN"              always;
        add_header X-XSS-Protection       "1; mode=block"           always;
        add_header X-Content-Type-Options "nosniff"                 always;
        add_header Referrer-Policy        "no-referrer-when-downgrade" always;

        # -------------------------------------------------------------------
        # 1. NextAuth routes → Frontend (Next.js)
        #    Prefijo más largo (/api/auth/) tiene prioridad sobre /api/
        #    Maneja: /api/auth/session, /api/auth/signin, /api/auth/callback/*
        # -------------------------------------------------------------------
        location /api/auth/ {
            proxy_pass         http://frontend/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------------
        # 2. Backend REST API → NestJS
        #    /api/* → backend (trailing slash strip /api/ prefix)
        #    Ej: GET /api/clientes → http://backend:4000/clientes
        # -------------------------------------------------------------------
        location /api/ {
            limit_req          zone=api burst=20 nodelay;
            proxy_pass         http://backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------------
        # 3. WebSocket (Socket.io) → Backend
        #    Requiere headers Upgrade + Connection para WebSocket
        # -------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
        }

        # -------------------------------------------------------------------
        # 4. Observability endpoints → Backend (sin prefijo /api/)
        #    GET /health → NestJS health check (DB + Redis + Memory)
        #    GET /metrics → NestJS metrics (requests, errors, response times)
        # -------------------------------------------------------------------
        location /health {
            proxy_pass         http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /metrics {
            proxy_pass         http://backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # -------------------------------------------------------------------
        # 5. Frontend (Next.js) → catch-all para páginas y assets
        #    Next.js maneja HMR y SSR internamente
        # -------------------------------------------------------------------
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        'upgrade';
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # -------------------------------------------------------------------
        # SSL/TLS — Listo para producción (descomentar al desplegar)
        # -------------------------------------------------------------------
        # listen 443 ssl http2;
        # ssl_certificate     /etc/nginx/ssl/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl/key.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        # ssl_prefer_server_ciphers off;
        # ssl_session_cache   shared:SSL:10m;
        # ssl_session_timeout 10m;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
